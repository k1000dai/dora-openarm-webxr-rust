[package]
name = "dora-openarm-webxr-rust"
version = "0.1.0"
authors = ["Enactic, Inc."]
description = "WebXR server node for OpenArm teleoperation (Rust port of dora-openarm-webxr)"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/k1000dai/dora-openarm-webxr-rust"
edition = "2024"
rust-version = "1.85"

[lib]
name = "dora_openarm_webxr_rust"
path = "src/lib.rs"

[[bin]]
name = "dora-openarm-webxr"
path = "src/main.rs"

[dependencies]
# Pinned to the Arrow version that dora-node-api 0.5.0 depends on,
# so that `ArrayRef` values cross the library/adapter boundary as the same type.
arrow = "=54.2.1"
dora-node-api = { version = "0.5.0", default-features = false }
eyre = "0.6"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
